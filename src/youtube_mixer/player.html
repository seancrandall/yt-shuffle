<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #000; }
    #player { width: 100%; height: 100%; }
  </style>
</head>
<body>
  <div id="player"></div>
  <!-- YouTube IFrame Player API -->
  <script src="https://www.youtube.com/iframe_api"></script>
  <!-- Qt WebChannel bridge (lets JS call back into the native PlayerView) -->
  <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
  <script>
    // The native side drives playback via window.playVideo / playList / next / prev
    // (runJavaScript). JS reports the now-playing video back to native via the bridge's
    // currentChanged(id), and auto-advances to the next shuffled video when one ends.
    let player = null;
    let ready = false;
    const pending = [];
    let currentIds = [];
    let currentIndex = 0;
    let bridge = null;
    let autoAdvance = true;
    // Requested playback quality: "medium" (360), "hd720", "hd1080", "hd1440",
    // or "cinema" (best available). YouTube caps quality by the player's on-screen
    // size, so higher tiers only actually arrive when the player is large enough
    // (cinema mode / fullscreen). Re-asserted on every loadVideoById because the
    // IFrame player resets quality per video.
    let currentQuality = "auto";

    function whenReady(fn) {
      if (ready) { try { fn(); } catch (e) { console.error(e); } }
      else { pending.push(fn); }
    }

    function notifyCurrent() {
      // QWebChannel exposes Qt *slots* (not signals) as callable, so call the
      // report_current slot, which re-emits currentChanged on the native side.
      if (bridge && currentIds.length) {
        try { bridge.report_current(currentIds[currentIndex]); } catch (e) { console.error(e); }
      }
    }

    function applyQuality() {
      if (!player || !player.setPlaybackQualityRange) return;
      if (currentQuality === "cinema") {
        player.setPlaybackQualityRange("small", "highres");
      } else if (currentQuality !== "auto") {
        player.setPlaybackQualityRange(currentQuality, currentQuality);
      }
    }

    function playIndex(i) {
      if (!currentIds.length) return;
      currentIndex = (i + currentIds.length) % currentIds.length;
      player.loadVideoById(currentIds[currentIndex]);
      applyQuality();
      notifyCurrent();
    }

    // Cue (load poster + ready state) without starting playback — used when the app
    // loads the last playlist on launch but shouldn't auto-play.
    function cueIndex(i) {
      if (!currentIds.length) return;
      currentIndex = (i + currentIds.length) % currentIds.length;
      player.cueVideoById(currentIds[currentIndex]);
      applyQuality();
      notifyCurrent();
    }

    window.onYouTubeIframeAPIReady = function () {
      player = new YT.Player("player", {
        width: "100%",
        height: "100%",
        playerVars: { autoplay: 0, controls: 1, rel: 0 },
        events: {
          onReady: () => {
            ready = true;
            applyQuality();
            const q = pending.splice(0, pending.length);
            q.forEach(fn => { try { fn(); } catch (e) { console.error(e); } });
          },
          // Auto-advance: when a video finishes, move to the next in the shuffled order.
          onStateChange: (e) => {
            if (e.data === YT.PlayerState.ENDED && autoAdvance) {
              playIndex(currentIndex + 1);
            }
          },
        },
      });
    };

    // Jump to a specific video, keeping the rest of the list intact so next/prev and
    // auto-advance continue through the shuffled order (used for row clicks).
    window.playVideo = function (id) {
      whenReady(() => {
        const idx = currentIds.indexOf(id);
        if (idx >= 0) {
          currentIndex = idx;
        } else {
          currentIds = [id];
          currentIndex = 0;
        }
        player.loadVideoById(id);
        applyQuality();
        notifyCurrent();
      });
    };

    window.playList = function (ids, index) {
      currentIds = ids || [];
      const start = index || 0;
      whenReady(() => playIndex(start));
    };

    // Load the order and cue (not play) the first video — for auto-loading the last
    // playlist on launch without auto-playing.
    window.cueList = function (ids, index) {
      currentIds = ids || [];
      const start = index || 0;
      whenReady(() => cueIndex(start));
    };

    // Replace the play order without reloading the current video (shuffle toggle): just
    // re-point the current index so next/prev follow the new order from where we are.
    window.setList = function (ids, index) {
      currentIds = ids || [];
      currentIndex = index || 0;
      notifyCurrent();
    };

    window.next = function () { whenReady(() => playIndex(currentIndex + 1)); };
    window.prev = function () { whenReady(() => playIndex(currentIndex - 1)); };
    // Toggle play/pause based on current state (Space hotkey from native).
    window.togglePlay = function () {
      whenReady(() => {
        if (!player) return;
        if (player.getPlayerState() === YT.PlayerState.PLAYING) player.pauseVideo();
        else player.playVideo();
      });
    };
    window.setAutoAdvance = function (v) { autoAdvance = !!v; };
    window.setQuality = function (q) {
      currentQuality = q || "auto";
      whenReady(applyQuality);
    };

    // Set up the QWebChannel bridge to the native side.
    if (typeof qt !== "undefined") {
      new QWebChannel(qt.webChannelTransport, function (channel) {
        bridge = channel.objects.bridge;
      });
    }
  </script>
</body>
</html>
