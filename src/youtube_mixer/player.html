<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #000; }
    #player { width: 100%; height: 100%; }
  </style>
</head>
<body>
  <div id="player"></div>
  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    // The native side calls window.playVideo / playList / next / prev via runJavaScript.
    // The YouTube IFrame API loads asynchronously, so we queue calls until the player is ready.
    let player = null;
    let ready = false;
    const pending = [];
    let currentIds = [];
    let currentIndex = 0;

    function whenReady(fn) {
      if (ready) { try { fn(); } catch (e) { console.error(e); } }
      else { pending.push(fn); }
    }

    function playIndex(i) {
      if (!currentIds.length) return;
      currentIndex = (i + currentIds.length) % currentIds.length;
      player.loadVideoById(currentIds[currentIndex]);
    }

    window.onYouTubeIframeAPIReady = function () {
      player = new YT.Player("player", {
        width: "100%",
        height: "100%",
        playerVars: { autoplay: 0, controls: 1, rel: 0 },
        events: { onReady: () => {
          ready = true;
          const q = pending.splice(0, pending.length);
          q.forEach(fn => { try { fn(); } catch (e) { console.error(e); } });
        } },
      });
    };

    window.playVideo = function (id) {
      whenReady(() => { currentIds = [id]; currentIndex = 0; player.loadVideoById(id); });
    };

    window.playList = function (ids, index) {
      currentIds = ids || [];
      const start = index || 0;
      whenReady(() => playIndex(start));
    };

    window.next = function () { whenReady(() => playIndex(currentIndex + 1)); };
    window.prev = function () { whenReady(() => playIndex(currentIndex - 1)); };
  </script>
</body>
</html>
