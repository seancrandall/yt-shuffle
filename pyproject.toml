[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "youtube-mixer"
description = "A native desktop YouTube playlist randomizer with full-coverage shuffle."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dynamic = ["version"]
authors = [{ name = "Sean Crandall" }]
keywords = ["youtube", "playlist", "shuffle", "randomizer", "pyside6", "qt"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Environment :: X11 Applications :: Qt",
    "Operating System :: OS Independent",
]
dependencies = [
    "PySide6>=6.6",
    "httpx>=0.27",
    "platformdirs>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-qt>=4.4",
    "ruff>=0.4",
]

[project.scripts]
youtube-mixer = "youtube_mixer.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
youtube_mixer = ["player.html", "icons/youtube-mixer.png"]

[tool.setuptools.dynamic]
# Single source of truth for the version is youtube_mixer.__version__.
version = { attr = "youtube_mixer.__version__" }

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]